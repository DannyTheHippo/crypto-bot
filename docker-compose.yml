services:
  # No Binance creds → app safely degrades to paper mode.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3100:3100'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cryptobot:cryptobot@postgres:5432/cryptobot
      NODE_ENV: production
      PORT: '3100'
      # Bind all interfaces so Prometheus (and the published host port) can reach /metrics + /health.
      # main.ts defaults to 127.0.0.1 for host runs; the container network is the isolation boundary.
      HOST: 0.0.0.0
      # ── Phase-4 best-of-breed experiment (testnet/demo ONLY) ──────────────────
      # Runs the promoted Donchian breakout — an UNVALIDATED EXPERIMENT that did NOT clear the step-D
      # validation gate (reports/nightly/long-battery-study.md) and underperformed the EMA-cross
      # incumbent in backtest. Deployed deliberately as a labeled experiment on the demo bot. To
      # restore the validated default, remove these four lines (ACTIVE_STRATEGY unset ⇒ ema-cross).
      # The live gate is unaffected — ModeControl + the four live gates still bind; never reaches live.
      # Params/interval pinned to the grid's least-bad Donchian (55/20 @ 1h, SR -0.045 / -3.02%) so the
      # running config matches the characterized best-of-breed — NOT the 20/10@1m code default (SR -0.78).
      ACTIVE_STRATEGY: donchian-breakout
      STRATEGY_INTERVAL: '1h'
      DONCHIAN_ENTRY: '55'
      DONCHIAN_EXIT: '20'
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('http');
          const req = http.get('http://localhost:3100/health/live', (res) => {
            process.exit(res.statusCode === 200 ? 0 : 1);
          });
          req.on('error', () => process.exit(1));
          req.end();
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot
      POSTGRES_DB: cryptobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryptobot']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:12.0.1
    ports:
      - '3101:3101'
    environment:
      GF_SERVER_HTTP_PORT: '3101'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
