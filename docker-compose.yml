services:
  # No Binance creds → app safely degrades to paper mode.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Host reboot stopped the stack 2026-07-10T23:28Z and nothing restarted it (~50 min lane
    # downtime until the next loop pass). unless-stopped survives daemon/host restarts while
    # keeping a deliberate `docker stop`/`compose stop` sticky.
    restart: unless-stopped
    ports:
      - '3100:3100'
    # Deploy knobs: .env.app (committed). Secrets: .env (gitignored). Later file wins on conflict.
    env_file:
      - .env.app
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('http');
          const req = http.get('http://localhost:3100/health/live', (res) => {
            process.exit(res.statusCode === 200 ? 0 : 1);
          });
          req.on('error', () => process.exit(1));
          req.end();
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot
      POSTGRES_DB: cryptobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryptobot']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Without this mount the config's rule_files glob silently matches nothing and every alert
      # is dead (discovered 2026-07-07: /api/v1/rules returned zero groups since first boot).
      - ./observability/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      # Backlog #22: named TSDB volume. The image's anonymous VOLUME /prometheus survived plain
      # recreates but not `down -v`/--renew-anon-volumes; history was migrated from the anonymous
      # volume at the 2026-07-13 switchover (docker run cp between volumes, see LOG.md).
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:12.0.1
    restart: unless-stopped
    ports:
      - '3101:3101'
    environment:
      GF_SERVER_HTTP_PORT: '3101'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
      # Anonymous read-only viewing so the provisioned dashboard loads without a login session
      # (fixes panel /api/ds/query returning 401 "user token not found" → "no data"). The admin
      # password above still gates editing/saving at /login.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_AUTH_ANONYMOUS_ORG_NAME: 'Main Org.'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ── Perp lane (Push 3 P3) ──
  # The app is single-venue-per-process (reads venues[0]) — a perp deployment is a SECOND app
  # container on the SAME image with its own env, own Postgres, and own Prometheus. Measurement
  # isolation is STRUCTURAL, not a convenience: the promotion/reflection/attribution queries have
  # no venue filter, so a shared DB would poison the spot lane's evidence with perp fills and
  # vice versa; shared Prometheus would collide on metric names/job labels between the two lanes.
  # Behind the `perp` Compose profile — a plain `docker compose up -d` creates NONE of this.
  #   Enable:   docker compose --profile perp up -d
  #   Rollback: docker compose --profile perp down          (named volumes RETAINED)
  #             docker compose --profile perp down -v        (also drops perp DB/TSDB history)
  postgres-perp:
    profiles: ['perp']
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot
      POSTGRES_DB: cryptobot
    volumes:
      - postgres_perp_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryptobot']
      interval: 10s
      timeout: 5s
      retries: 5

  app-perp:
    profiles: ['perp']
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3102:3100'
    # Deploy knobs: .env.app-perp (committed). Secrets: .env (gitignored). Later file wins on conflict.
    env_file:
      - .env.app-perp
      - .env

    depends_on:
      postgres-perp:
        condition: service_healthy
      prometheus-perp:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('http');
          const req = http.get('http://localhost:3100/health/live', (res) => {
            process.exit(res.statusCode === 200 ? 0 : 1);
          });
          req.on('error', () => process.exit(1));
          req.end();
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus-perp:
    profiles: ['perp']
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    ports:
      - '9091:9090'
    volumes:
      - ./observability/prometheus-perp.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      - prometheus_perp_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
  postgres_perp_data:
  prometheus_perp_data:
