services:
  # No Binance creds → app safely degrades to paper mode.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Host reboot stopped the stack 2026-07-10T23:28Z and nothing restarted it (~50 min lane
    # downtime until the next loop pass). unless-stopped survives daemon/host restarts while
    # keeping a deliberate `docker stop`/`compose stop` sticky.
    restart: unless-stopped
    ports:
      - '3100:3100'
    # Deploy knobs: .env.app (committed). Secrets: .env (gitignored). Later file wins on conflict.
    env_file:
      - .env.app
      - .env
    # v3 §8 memory guardrail: NODE_OPTIONS is a Node runtime tuning flag, not an AppConfig zod-parsed
    # knob (unlike .env.app's contents), so it lives here rather than round-tripping through the
    # committed knob file. Caps the heap so an OOM shows up as a bounded, alertable RSS climb
    # (AppMemoryHigh, observability/alerts.rules.yml) rather than an unbounded host-level kill.
    environment:
      NODE_OPTIONS: --max-old-space-size=1024
    # v3 §8/§9: single unified process (both venues, one composition graph) replaces the v2
    # spot/perp process pair — footprint acceptance is stack ≤ ~2.5 GiB, app ≤ ~1.2 GiB (e2-medium
    # verdict); mem_limit here is the hard ceiling backing that budget, tightened at the validation
    # gate to measured peaks.
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('http');
          const req = http.get('http://localhost:3100/health/live', (res) => {
            process.exit(res.statusCode === 200 ? 0 : 1);
          });
          req.on('error', () => process.exit(1));
          req.end();
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5432:5432'
    mem_limit: 512m
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot
      POSTGRES_DB: cryptobot
      # W1 (Grafana rebuild): read by grafana_ro.sql's `\getenv` on initdb-time first-boot only (an
      # empty EMPTY volume) — see that file's own header comment for the separate manual-apply path
      # an already-provisioned volume needs. Secret; sourced from .env, never .env.app.
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
    volumes:
      # v3 cutover (2026-07-21): NEW volume name — the v2 stack owns crypto-bot_postgres_data and
      # the greenfield decision (owner, decision ledger #7) starts v3 on an EMPTY database (fresh
      # Drizzle schema, playbook seeded from code). The v2 volume is left on disk untouched;
      # pruning it is an owner call after the GCP lift retires the local stack.
      - postgres_data_v3:/var/lib/postgresql/data
      # Mounted read-only; the postgres entrypoint runs every *.sql here via `psql -f` ONCE, only
      # against a fresh (empty) data volume — see grafana_ro.sql's own header for the standalone
      # apply command an already-initialized volume needs instead.
      - ./observability/grafana/grafana_ro.sql:/docker-entrypoint-initdb.d/grafana_ro.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryptobot']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    ports:
      - '9090:9090'
    mem_limit: 512m
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Without this mount the config's rule_files glob silently matches nothing and every alert
      # is dead (discovered 2026-07-07: /api/v1/rules returned zero groups since first boot).
      - ./observability/alerts.rules.yml:/etc/prometheus/alerts.rules.yml:ro
      # Backlog #22: named TSDB volume. The image's anonymous VOLUME /prometheus survived plain
      # recreates but not `down -v`/--renew-anon-volumes; history was migrated from the anonymous
      # volume at the 2026-07-13 switchover (docker run cp between volumes, see LOG.md).
      # v3 cutover (2026-07-21): NEW volume name, same greenfield rationale as postgres_data_v3 —
      # v2's TSDB history stays in crypto-bot_prometheus_data for owner-driven pruning later.
      - prometheus_data_v3:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:12.0.1
    restart: unless-stopped
    ports:
      - '3101:3101'
    mem_limit: 256m
    environment:
      GF_SERVER_HTTP_PORT: '3101'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
      # Anonymous read-only viewing so the provisioned dashboard loads without a login session
      # (fixes panel /api/ds/query returning 401 "user token not found" → "no data"). The admin
      # password above still gates editing/saving at /login.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_AUTH_ANONYMOUS_ORG_NAME: 'Main Org.'
      # W1 (Grafana rebuild): read by provisioning/datasources/postgres.yml's `$__env{}` password
      # interpolation for the RO datasource — this is the GRAFANA container's own env (distinct
      # from the postgres service's identically-named var above, which it reads for the DB-side
      # role-creation script).
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data_v3:
  grafana_data:
  prometheus_data_v3:
