services:
  # No Binance creds → app safely degrades to paper mode.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3100:3100'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://cryptobot:cryptobot@postgres:5432/cryptobot
      NODE_ENV: production
      PORT: '3100'
      # Bind all interfaces so Prometheus (and the published host port) can reach /metrics + /health.
      # main.ts defaults to 127.0.0.1 for host runs; the container network is the isolation boundary.
      HOST: 0.0.0.0
      # ── Agentic LLM strategy (testnet/demo ONLY — EXPERIMENT, never live) ──────
      # The lane is permanently EXPERIMENT-ONLY: non-deterministic, step-D-uncertifiable, and the
      # boot interlock refuses TRADING_MODE=live. ANTHROPIC_API_KEY comes from .env (env_file);
      # without it the lane binds the inert stub and proposes nothing.
      ACTIVE_STRATEGY: agentic
      # Demo cadence: 5m candles → first decision ≤5 min after boot, and 288 decisions/day stays
      # under AGENTIC_MAX_CALLS_PER_DAY (500) so the lane runs sustainably all day. Warmup is a fast
      # historical fetch (seconds), so this only paces LIVE decisions, not startup. Drop to 1m for a
      # faster first trade (1440/day still under the cap); raise it to spend fewer LLM calls.
      STRATEGY_INTERVAL: '5m'
      # Sonnet-5, not Opus: the lane is permanently EXPERIMENT-ONLY, and at ~288 decides/day the
      # cheaper model is the cost-aware default. This block overrides env_file, so it must match the
      # intended model in .env or it silently forces a pricier model on the running demo.
      AGENTIC_MODEL: claude-sonnet-5
      AGENTIC_WARMUP_BARS: '50'
      # Auto-promote a reflection-minted playbook to ACTIVE once ≥30 closed trades have accrued
      # (validated read-side; takes effect live, no restart). Gated at 30 because the toy scorecards
      # are noise below that; 0 disables (manual `pnpm playbook:promote` only). Dormant until real
      # trades exist, so it is inert on a fresh boot.
      AGENTIC_AUTO_PROMOTE_MIN_TRADES: '30'
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require('http');
          const req = http.get('http://localhost:3100/health/live', (res) => {
            process.exit(res.statusCode === 200 ? 0 : 1);
          });
          req.on('error', () => process.exit(1));
          req.end();
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cryptobot
      POSTGRES_PASSWORD: cryptobot
      POSTGRES_DB: cryptobot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryptobot']
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:12.0.1
    ports:
      - '3101:3101'
    environment:
      GF_SERVER_HTTP_PORT: '3101'
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana}
      # Anonymous read-only viewing so the provisioned dashboard loads without a login session
      # (fixes panel /api/ds/query returning 401 "user token not found" → "no data"). The admin
      # password above still gates editing/saving at /login.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Viewer'
      GF_AUTH_ANONYMOUS_ORG_NAME: 'Main Org.'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
