# Prometheus alerting rules (Phase 10). Every rule below references a metric the app ACTUALLY emits
# (/metrics via @willsoto/nestjs-prometheus): event_loop_delay_p99_seconds, event_loop_utilization,
# mode_info{requested,effective}, boot_info{boot_id}, kill_switch_state{state} (MetricsService, 5s),
# reconciliation_mismatch_total + reconciliation_runs_total{venue,result} (ReconciliationService), and
# agent_decide_total{outcome} (AgentMetricsRecorder), and app_log_events_total{level,event}
# (log-event-metrics.ts, via the pino logMethod hook). All rules are ACTIVE — none stubbed.
# Trading gauges (equity_usdt, day_pnl_usdt, drawdown_ratio, realized_pnl_usdt, position_*, fills_total,
# orders_total{outcome}, orders_rejected_total{stage,code}) are also emitted and surfaced on the Grafana
# dashboards. VenueTerminalRejectBurst below (crypto-bot-execution) covers venue-side reject bursts on
# orders_rejected_total{stage="exchange"}; add further threshold alerts here (e.g. daily-loss / drawdown
# approaching limits) as desired.
groups:
  - name: crypto-bot-health
    rules:
      - alert: TargetDown
        expr: up{job="crypto-bot"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'crypto-bot /metrics target is down'
          runbook: 'docs/runbook.md#halt-response'

      - alert: EventLoopBudgetBreach
        # §8 event-loop budget: p99 loop delay over 50ms sustained means the single-threaded hot
        # path (strategy → risk → execution) is being starved — order latency and the OMS query
        # loops degrade. Budget is conservative for a trading loop.
        expr: event_loop_delay_p99_seconds > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: 'Event-loop p99 delay over the 50ms budget ({{ $value }}s)'
          runbook: 'docs/runbook.md'

      - alert: EventLoopUtilizationHigh
        expr: event_loop_utilization > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Event-loop utilization sustained above 90% ({{ $value }})'

      # v3 §8 memory guardrail: the single unified process (both venues, one composition graph)
      # replaces the v2 spot/perp process pair — process_resident_memory_bytes is prom-client's
      # default metric (always emitted, no app-side wiring needed). 1.2 GiB is the compose mem_limit
      # (1536m) minus headroom before an OOM kill; threshold tightens to measured peaks at the
      # validation gate per the spec's own footprint-acceptance note.
      - alert: AppMemoryHigh
        expr: process_resident_memory_bytes > 1.2e9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'crypto-bot RSS sustained above 1.2 GiB for 10m ({{ $value | humanize1024 }}B) — approaching the 1536m compose mem_limit'
          runbook: 'docs/runbook.md'

      # 2026-07-29: a 49-minute demo-fapi outage (293 fill-poll + 47 reconcile-sweep + 16
      # funding-ingest failures, 502s from the venue) opened and closed inside one inter-pass gap and
      # left ZERO trace on every surface a loop pass reads — the alarm list showed only an unrelated
      # latch, and the `docker logs` tail the pass reads had already scrolled past all 340 lines.
      # app_log_events_total (log-event-metrics.ts) puts that class in the TSDB where it survives a
      # container recreate; this rule is what makes it arrive rather than wait to be queried.
      #
      # error|fatal ONLY, deliberately. A warn-rate companion belongs here too, but this stack has no
      # measured warn baseline yet — the metric ships with this rule — and a threshold guessed without
      # one either never fires or fires forever. Add it once a week of samples exists; until then a
      # warn-driven incident is caught by the pass's own log read, exactly as it is today.
      #
      # Severity warning, not critical: this is a derived measurement, so it annotates a pass rather
      # than gating one. Fails OPEN by construction — a dead counter reads 0 and never blocks.
      - alert: AppErrorLogRateElevated
        expr: sum(rate(app_log_events_total{level=~"error|fatal"}[15m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Sustained error/fatal log rate ({{ $value | humanize }}/s over 15m) — a failure axis is retrying, not resolving'
          runbook: 'docs/runbook.md'

  - name: crypto-bot-mode
    rules:
      # Paper-honesty visibility: surfaces whenever the process is resolving to a non-paper effective
      # mode. Not an error (live is legitimate when armed) — an info-level notice so operators always
      # know the live wall state. Pages should come from the kill-switch alerts (below) once emitted.
      - alert: EffectiveModeLive
        expr: mode_info{effective="live"} == 1
        for: 0m
        labels: { severity: info }
        annotations:
          summary: 'Effective trading mode is LIVE (boot_id label on boot_info)'
          runbook: 'docs/runbook.md#re-arm-live-arming-interlock-10b--out-of-session'

  - name: crypto-bot-safety
    rules:
      # kill_switch_state is emitted by MetricsService (sampled every 5s; only the active state = 1).
      - alert: KillSwitchEngaged
        expr: kill_switch_state{state!="RUNNING"} == 1
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Kill switch is engaged (not RUNNING) — trading halted'
          runbook: 'docs/runbook.md#halt-response'

      - alert: HaltedDegraded
        expr: kill_switch_state{state="HALTED_DEGRADED"} == 1
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Kill switch HALTED_DEGRADED — cancels unconfirmed, venue orders may be live'
          runbook: 'docs/runbook.md#halt-response'

      # Halting mismatch classes (UNKNOWN_OURS_OPEN, FILL_FOR_UNKNOWN_ORDER, balance drift) engage
      # the kill switch and label the pass result="halt" — this pages the reconciliation cause by
      # name (KillSwitchEngaged fires alongside, but its state label doesn't say WHY).
      - alert: ReconciliationHalt
        expr: increase(reconciliation_runs_total{result="halt"}[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Reconciliation hit a halting mismatch class — kill switch engaged, never auto-flattened'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # reconciliation_mismatch_total is split by mismatch class since backlog #24. The benign
      # classes are excluded here: foreign_open_order (the shared demo wallet's manual-trading
      # steady state — the reason this alert used to fire 24/7), adopted_terminal and
      # backfilled_fill (stream misses healed from venue truth — self-correcting by definition).
      # stale_venue_open joins them (2026-07-31 fix): a single occurrence is the axis's own sampling
      # race — an ordinary strategy cancel landing inside a 16-45s per-symbol sweep on a 30s reconcile
      # cadence — not a divergence, and it would otherwise fire this routinely on every such cancel.
      # It is NOT dropped from paging entirely: a streak surviving cfg.driftPasses consecutive passes
      # escalates to the same UNKNOWN_OURS_OPEN halt, which still pages critical via ReconciliationHalt
      # + KillSwitchEngaged below regardless of this warning-tier exclusion.
      # Everything else (sweep/query failures, non-adoptable statuses, and the halting classes) is
      # actionable signal; halting classes ALSO page critical via ReconciliationHalt +
      # KillSwitchEngaged above.
      - alert: ReconciliationMismatch
        expr: increase(reconciliation_mismatch_total{class!~"foreign_open_order|adopted_terminal|backfilled_fill|stale_venue_open"}[5m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Actionable reconciliation mismatches in the last 5m (benign classes excluded — see class label)'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # A stalled reconciler is itself a fault (§8): a pass that throws leaves venue truth
      # unconfirmed while trading continues — the 2026-07-07 CANCEL_PENDING/VENUE_CANCELED
      # TransitionError killed every pass for an hour with only warn lines to show for it.
      # "Stalled" = no pass COMPLETING, deliberately not "no clean pass": on the shared demo
      # wallet, foreign resting orders make a small per-pass mismatch count the healthy steady
      # state (WARN-and-ignore class), so a clean-pass age would fire forever on a working
      # reconciler. 10 minutes = 20 missed 30s passes, far beyond transient venue flake.
      #
      # Pass 49 (2026-07-30): `result!="error"` was wrong — it counts `skipped` (the re-entrancy
      # branch in reconciliation.service.ts, engaged when a tick coalesces onto a still-running pass
      # WITHOUT reading any venue truth at all) as proof of a completed pass. The two venues reconcile
      # sequentially in one 30s-ticked pass and a pass takes longer than the tick, so on a HEALTHY
      # reconciler every other tick is a skip already (measured live: 1290 skipped vs 1282+1282 clean
      # over a 20.7h boot) — and a WEDGED pass makes every later tick a skip too, so the skip rate
      # RISES exactly when passes stop completing. The old selector was therefore suppressed by the
      # very counter that climbs during the outage it exists to catch (measured live:
      # sum(increase(result!="error"[10m])) = 28.72, of which result="skipped" alone contributed 9.23).
      # Narrowed to only the results that prove a pass read venue truth end-to-end: clean, mismatch, or
      # halt.
      #
      # `or absent(...)` is not optional on a critical liveness gate: the sibling
      # AgentClientFatalLatch fix (this same file) found that an `and`-shaped expr collapses to the
      # empty set the instant its operand series is absent — the same failure mode applies here to a
      # bare `sum(increase(...)) == 0`, which reads as absent (never firing) rather than 0 if the
      # series itself has never been created (e.g. a fresh process before the constructor's own
      # zero-seed below has run, or a metric rename). absent() catches that case directly.
      - alert: ReconcilerStalled
        expr: |
          sum(increase(reconciliation_runs_total{result=~"clean|mismatch|halt"}[10m])) == 0
          or absent(reconciliation_runs_total{result=~"clean|mismatch|halt"})
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'No reconciliation pass has completed in over 10 minutes — venue truth unconfirmed'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # Catches intermittent pass errors that never trip the 10-minute stall (some passes clean,
      # some throwing) — e.g. one symbol's sweep failing while the rest reconcile.
      - alert: ReconcilePassErrors
        expr: increase(reconciliation_runs_total{result="error"}[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Reconciliation passes are erroring (result="error" in the last 15m)'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # 2026-07-27 incident (Task C3): reconciliation_last_success_timestamp_seconds is the EXACT
      # gauge RecoveryCoordinatorService's cleanWithin/cleanAfter/cleanIsLatest preconditions read to
      # gate kill-switch auto-resume — it sat at literal 0 for 39h with zero alarm (lastCleanAt never
      # once set). 0 is ALSO the gauge's uninitialised-at-boot default, so a naive
      # `time() - gauge > X` is always huge the moment the process starts; the `==0` branch below
      # catches "never once succeeded" directly (boot or otherwise) while `for: 30m` gives a fresh
      # boot's first genuinely clean pass time to land before paging.
      - alert: ReconciliationNeverCleanSustained
        expr: |
          reconciliation_last_success_timestamp_seconds == 0
          or
          (time() - reconciliation_last_success_timestamp_seconds) > 7200
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: 'No clean reconciliation pass has succeeded in 2h+ (or ever) — kill-switch auto-resume stays gated'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # 2026-07-27 (Task C3, same incident as ReconciliationNeverCleanSustained above): sweep_failure
      # was added to reconciliation.service.ts's NON_ACTIONABLE_CLASSES so a transient per-symbol
      # sweep error can no longer starve the clean stamp forever (verified: a failing venue's sweep
      # reproduced read-only in the same container/credentials succeeded 48/48 — client-state, not
      # venue divergence). That relaxation means a CHRONIC sweep_failure axis — the one case the old
      # all-or-nothing clean gate accidentally caught — could now go silently invisible; this backstops
      # exactly that: severity warning (the class is individually transient by design; only a
      # sustained run of it, not a single blip, is actionable).
      - alert: ReconciliationSweepFailureSustained
        expr: increase(reconciliation_mismatch_total{class="sweep_failure"}[30m]) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'sweep_failure mismatches persisting 15m+ — a reconciliation read axis is chronically unconfirmed'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

  - name: crypto-bot-market-data
    rules:
      # 2026-07-16 incident (Pass 30): all five spot candle channels hung silently for 8h — ccxt's
      # watch* future stays pending forever when the venue drops a subscription server-side, the
      # supervised loops only act when the promise settles, and nothing exported channel age. The
      # in-process watchdog now force-reconnects at 180s of core-channel silence; this alert is the
      # independent backstop for the watchdog itself failing to recover the stream (10m of staleness
      # = at least 3 forced-reconnect attempts that did not help). Core channels only: trade/book
      # power info blocks and paper fills, and legitimately idle longer on quiet markets.
      - alert: MarketChannelStale
        expr: max by (symbol, channel) (market_channel_staleness_seconds{channel=~"ticker|candle:.*"}) > 600
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'Market-data channel {{ $labels.channel }} for {{ $labels.symbol }} silent >10m despite the stream watchdog — strategies are trading blind'
          runbook: 'docs/runbook.md'

      # The watchdog firing occasionally is the fix working; a sustained reconnect cadence means
      # the venue connection is flapping (or the stall diagnosis is wrong) and deserves a look
      # before it degrades decide cadence.
      - alert: MarketStreamReconnectStorm
        expr: increase(market_stream_forced_reconnects_total[1h]) >= 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Stream watchdog forced {{ $value }} reconnects in the last hour — market-data connection is flapping'
          runbook: 'docs/runbook.md'

      # 2026-08-04 (Pass 62): fearGreed/positioning/tradeFlow are enabled, feed the decide prompt, and
      # until this pass had NO metric at all — a total, permanent failure of any of them produced no
      # gauge, no counter and no alert. The failure mode these two rules exist for is NOT a thrown
      # request: each poller stores its snapshot only `if (snapshot)`, and toSnapshot returns null on a
      # 200 whose body shape changed, so a dead upstream throws nothing, increments no error counter,
      # logs nothing, and freezes lastSuccessfulPollAt while latest() quietly answers null past
      # 2x pollIntervalMs and the prompt block vanishes. Staleness over lastSuccessfulPollAt is the only
      # signal that distinguishes that from a quiet market.
      #
      # 21600s = 6h = FEAR_GREED_POLL_MS's own cadence, so this threshold is deliberately conservative
      # for the other two (trade_flow polls every 60s, positioning every 300s — .env.app). A per-feed
      # threshold needs a poll-interval info series that does not exist yet.
      #
      # The `== -1` never-polled sentinel is deliberately NOT alerted on, for exactly the reason the
      # liquidation rule below is omitted: all three NOOP context feeds answer lastSuccessfulPollAt()
      # null, so a feed turned OFF pins its gauge at -1 forever and `== -1` would page permanently on a
      # deliberate configuration. These flags are toggleable A/B arms (environment.config.ts documents
      # AGENTIC_TRADEFLOW as riding the same information-context control arm as DERIVATIVES_FEED_ENABLED,
      # and all three default to 'false'), so that is a live foot-gun, not a hypothetical — the running
      # process already exports sentiment_feed_staleness_seconds -1 with SENTIMENT_FEED_ENABLED=false.
      # A never-polled ENABLED feed is instead caught by TargetDown and by the poll-error counter.
      - alert: ContextFeedStale
        expr: context_feed_staleness_seconds > 21600
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: 'Context feed {{ $labels.feed }} has not polled successfully ({{ $value }}s) — its block is silently missing from the decide prompt'
          runbook: 'docs/runbook.md'

      # >= 5, not > 0, matching MarketStreamReconnectStorm's precedent above: a single transient 5xx or
      # DNS blip on a public REST endpoint is the poller working, not a defect worth a page, and
      # trade_flow alone polls 60x/hour. Note this rule does NOT catch the failure the staleness gauge
      # exists for — a 200 whose body shape changed parses to null, throws nothing, and increments this
      # counter not at all.
      - alert: ContextFeedPollErrors
        expr: increase(context_feed_poll_errors_total[1h]) >= 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Context feed {{ $labels.feed }} raised {{ $value }} poll error(s) in the last hour'
          runbook: 'docs/runbook.md'

      # NOT ADDED, deliberately: a `liquidation_stream_healthy == 0` rule. NOOP_LIQUIDATION_FEED's
      # streamHealthy() returns false (context-feeds.module.ts), so that expression fires permanently
      # whenever AGENTIC_LIQUIDATIONS_ENABLED is false — a deliberately disabled feed would page
      # forever. Wiring it needs a feed-enabled info series to join against first, which would also let
      # the `== -1` clause dropped above come back; the gauges are exported and dashboard-readable in
      # the meantime.

  - name: crypto-bot-agentic
    rules:
      # The Anthropic client latches itself degraded on a FATAL API error (bad key, rejected schema,
      # exhausted credit — anthropic-agent-client.ts): every later propose() short-circuits without an
      # HTTP call, so the lane looks alive while making zero LLM calls (2026-07-07: a 400 on the first
      # plan-mode decide cost ~1h of dead air; 2026-07-27: a credit-exhaustion 400 at 21:16Z cost 3h+).
      #
      # Keyed on the agent_client_latched LEVEL (metrics.service.ts), not on any counter window. The
      # previous expr (`sum(agent_decide_total{outcome="error_fatal"}) > 0`) could not distinguish "the
      # lane is dead right now" from "a fatal happened at some point this boot" — it stayed firing until
      # a container recreate even after recovery, which is now reachable at all because the latch expires
      # (FATAL_LATCH_COOLDOWN_MS) instead of holding until restart. A permanently-stuck critical alert is
      # worse than none here: the daily loop consumes this endpoint directly (there is no Alertmanager
      # and none is wanted), so a rule that never clears masks every later alert behind its own noise.
      #
      # Every counter-window formulation was tried on paper first and rejected:
      # `increase(...{outcome="client_latched"}[2h])` reads 0 through the FIRST latch of a container's
      # life, because prom-client creates a label child lazily and a batched consult births the whole
      # series in one tick — every sample in the range is then equal (the same first-sample-after-reset
      # trap AgenticLaneSilent documents below), pushing worst-case detection past 4h. Any
      # window also couples the rule's correctness to consult cadence, so a host-sleep gap wider than
      # the window would false-CLEAR while the lane was still dead — this stack runs on a laptop with a
      # documented sleep duty cycle. A gauge fires on the next scrape, clears on the next scrape, and
      # depends on no cadence at all.
      #
      # Pass 48 (2026-07-30): SPLIT off the one cause the loop cannot do anything about. Both operands
      # are per-instance (this stack runs exactly one target, job="crypto-bot" — observability/
      # prometheus.yml), so `on(instance, job)` pins the match rather than leaning on the default
      # common-label behavior. This fires ONLY when latched AND the active cause is anything other
      # than insufficient_credit — the unfunded-account case pages via AgentClientLatchedUnfundedAccount
      # below instead, at warning, so the daily loop stops re-investigating a condition it is already
      # told about (research/loop/state.md — the account has been unfunded since 2026-07-27T21:16Z).
      #
      # `unless`, not `and (… == 0)`: verified live that agent_client_latch_cause currently returns an
      # EMPTY vector on this Prometheus (a rollback, a rename, or the recorder constructor swallowing a
      # seed-loop throw by design all produce the same absence), and `and on(...) (rhs == 0)` collapses
      # to empty the moment its right side is absent — the critical would then die silently over a dead
      # lane instead of firing. `unless` keeps this armed whenever the cause series is absent OR reads
      # anything but 1 for insufficient_credit, and only the positive {cause="insufficient_credit"}==1
      # match suppresses it — fails CLOSED toward paging, per the classifier's own failure direction.
      - alert: AgentClientFatalLatch
        expr: |
          agent_client_latched == 1
          unless on(instance, job) (agent_client_latch_cause{cause="insufficient_credit"} == 1)
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Agent client is latched degraded by a FATAL API error for a cause OTHER than the known unfunded-account one — decides suppressed, zero LLM calls (clears on the first decide that completes)'
          runbook: 'docs/runbook.md'

      # Pass 48 companion: the SAME latch, but ONLY for the one cause a loop pass cannot fix and has
      # already diagnosed — an unfunded LLM provider account (Anthropic AND Moonshot both unfunded
      # since 2026-07-27T21:16Z, research/loop/state.md). Severity warning, deliberately: loop:sweep
      # promotes only `critical` to the blocking prometheus_alert_firing alarm (playbook §3), and this
      # condition is owner-blocked, not investigable — promoting it would wedge every pass on a fact it
      # already knows, exactly the defect this pass exists to remove.
      #
      # What `for: 5m` actually does here (an all-zero fresh boot cannot false-positive this rule with
      # or without a grace window — at all-zero, this rule's own operand
      # {cause="insufficient_credit"}==1 is empty, so it cannot fire in that state): the recorder writes
      # the latch level and its cause in one synchronous block, so a FRESH insufficient_credit latch
      # suppresses AgentClientFatalLatch on the very same scrape that sets the cause — leaving a
      # 5-minute window in which NEITHER alert is firing. Accepted: this warning is annotation-only (it
      # never gates the loop), and the operator-facing banner in loop-sweep.mjs's renderMarkdown is
      # driven off the metric directly, not off this alert's firing state, so the 5m gap costs nothing
      # observable.
      - alert: AgentClientLatchedUnfundedAccount
        expr: |
          agent_client_latched == 1
          and on(instance, job) (agent_client_latch_cause{cause="insufficient_credit"} == 1)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'LLM provider account is unfunded — decides suppressed. This is NOT a defect and is not investigable by an automated pass; the only remedy is the owner adding credit. The lane self-heals within 30 minutes of credit landing, with no redeploy required.'
          runbook: 'docs/runbook.md'

      # 2026-07-27 (45h production halt): agent_decide_total emitted ZERO rows for the whole outage
      # and nothing paged — AgentClientFatalLatch above only trips on one specific outcome
      # (error_fatal), so a lane that stops calling decide() at all for any OTHER reason (crash loop,
      # scheduler wedge, an outcome this file never anticipated) had no backstop. Window: normal
      # cadence is STRATEGY_INTERVAL=15m, but AGENTIC_FALLBACK_CONSULT_BARS=8 stretches a legitimately
      # quiet market's consult gap to a 2h floor — 6h gives 3x that floor's margin so a slow news day
      # can never false-positive. `or absent_over_time(...)` catches the total-silence case directly
      # (the metric never emits a single sample, exactly what happened in the outage) — relying on
      # `sum(increase(...))==0` alone would hit the first-post-reset-sample undercount trap:
      # increase() and rate() both miss a counter's first sample after a container recreate resets it
      # (a fresh series has nothing to increase FROM), so a lane that emits exactly one decide right
      # after a redeploy reads as zero activity. This rule is the surviving in-file reference for that
      # trap — the two AgenticReflection* alerts that used to document it were deleted 2026-07-30 with
      # the in-process reflection loop (they selected label values only reflection ever wrote, so they
      # would have selected empty series forever).
      - alert: AgenticLaneSilent
        expr: |
          sum(increase(agent_decide_total[6h])) == 0
          or
          absent_over_time(agent_decide_total[6h])
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Zero agent_decide_total activity in 6h — the agentic strategy lane has gone silent'
          runbook: 'docs/runbook.md'

      # agentic_budget_remaining_usd has a known stale/uninitialised-at-boot failure mode (a peer is
      # fixing it separately) — for: 5m, deliberately NOT 0m, so a fresh boot's transient 0 never
      # pages before the gauge is populated from a real budget read.
      - alert: AgenticBudgetExhausted
        expr: agentic_budget_remaining_usd == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Agentic LLM budget remaining is $0 — the lane may be throttled or refusing calls'
          runbook: 'docs/runbook.md'

      # WATCH-V4-8 (2026-07-29): a redeploy must not be able to erase a standing outage. Both LLM
      # provider accounts were unfunded and the lane had not reached the model since 07-27T20:15:31Z,
      # yet an 08:17:56Z redeploy reset agent_client_latched to 0, cleared AgentClientFatalLatch and
      # wiped the boot-scoped agent_decide_total series — 21 rules loaded, 0 firing, over a 37h-dead
      # lane. Every other rule in this group is boot-scoped by construction (a level the new process
      # has not set yet, or a counter window that restarts with the container), so none of them can
      # see across a restart. agent_last_success_timestamp_seconds is seeded at boot from
      # agent_decisions, so it reads the TRUE age on the first scrape of EVERY boot and the playbook's
      # mandated 15-30 min post-deploy soak can no longer sign off on a dead lane.
      #
      # 9h is the lane's structural ceiling plus margin, not taste. The model self-schedules the whole
      # batch via nextConsultBars, bounded at 32 (agent-prompt.ts DECISION_V2_BOUNDS) x 15m
      # (STRATEGY_INTERVAL) = 8h; AGENTIC_FALLBACK_CONSULT_BARS=8 only FLOORS the gap at 2h when no
      # schedule is live, it does not cap it — so the ~3h a naive reading of the fallback clock
      # suggests would false-positive on a legitimate long self-schedule. Measured over the real
      # decides in agent_decisions on 2026-07-29: p95 gap 30min, p99 111min, and exactly three gaps
      # above 3h — 210min, 270min, and one of 2806min (46.8h). That widest gap is NOT the 07-27 LLM
      # outage: it spans 07-25T11:00Z→07-27T09:46Z, a window in which agent_decisions holds zero rows
      # of ANY kind (not even scheduled skips) between 07-25T15:00Z and 07-27T09:00Z — the host was
      # asleep. The 07-27 outage itself has produced no gap row at all, because it has not closed. So
      # the widest gap observed with the app actually RUNNING is 270min, and 9h clears it by 2x while
      # still sitting above the 8h structural ceiling.
      #
      # Severity WARNING, and that is the load-bearing choice. loop:sweep promotes only `critical` to
      # the blocking prometheus_alert_firing alarm, and the playbook blocks all improvement work until
      # alarms clear. This lane is dead now and stays dead until the owner funds the accounts, so a
      # critical here would fire on the next deploy and wedge every subsequent pass on a condition no
      # pass can fix (a false alarm is not free). A firing after a long host sleep is the EXPECTED
      # recurring case, not an edge: the documented duty cycle produces multi-day host-down windows
      # (43h observed above), and on every wake the boot seed correctly stamps a >9h-old timestamp,
      # so this annotates until the first post-wake consult. Gating the expr on process_start_time to
      # suppress that would reintroduce exactly the boot-scoped blindness this rule removes.
      # Annotating hands the pass the fact it was missing without handing it a gate it cannot clear;
      # promotion to blocking is a one-line severity edit once the accounts are funded.
      # AgentClientFatalLatch stays critical and still pages the moment a live latch is observable
      # in-process — this is its restart-surviving companion, not its replacement.
      #
      # An unseeded gauge reads 0 (prom-client emits a label-less gauge from registration), so
      # time() - 0 is already past the threshold and "never succeeded" needs no second branch. The
      # `or absent_over_time(...)` is a different case and the same one AgenticLaneSilent above guards:
      # a gauge that STOPS being emitted while the process stays up (a registration/scrape-path
      # regression) empties the first branch's vector and would read as permanently healthy, with
      # TargetDown silent because nothing is down. A 15m lookback cannot fire on a redeploy — a
      # restart leaves samples earlier in the window — only on a series that is genuinely gone.
      # for: 5m covers the seconds-scale window between process start and the boot seed (startTrading
      # seeds ahead of the venue pin) with ~50x margin. It is NOT set to the soak length: loop:sweep
      # reads only rules in state `firing` (scripts/loop-sweep.mjs) and the history probe queries
      # ALERTS{alertstate="firing"}, so a `for:` equal to the playbook's 15-min MINIMUM soak would
      # still be `pending` when the soak-ending sweep runs — invisible to the digest, on the very pass
      # that shipped this. 5m leaves >=10 min of margin inside the shortest legal soak.
      - alert: AgenticNoSuccessfulDecideSustained
        expr: |
          (time() - agent_last_success_timestamp_seconds) > 32400
          or
          absent_over_time(agent_last_success_timestamp_seconds[15m])
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'No agentic decide has produced an accepted decision in 9h+ (or ever, or the liveness gauge stopped being emitted) — unlike agent_client_latched this signal survives a redeploy'
          runbook: 'docs/runbook.md'

      # 2026-07-31: agentic_venue_stop_total had NO alert of any kind — a binanceusdm
      # HYPE/USDT:USDT BUY STOP_MARKET sat non-terminal for ~11h across 3+ boots because
      # reconcileOrphanedAlgoStop's best-effort cancel (agentic.strategy.ts) throws into a bare
      # `catch {}` and nothing downstream could tell "never matched" from "matched and the cancel
      # threw" — until this pass added the `orphan_cancel_failed` label (alongside `orphan_scan`/
      # `orphan_readopt`) precisely to make that second case visible. Without a rule here, the exact
      # recurrence signature of that incident — this label incrementing every ~15m bar forever —
      # could fire indefinitely and page no one.
      #
      # Threshold >1 in a 30m window, not >0: reconcileOrphanedAlgoStop runs once per symbol per bar
      # with no active plan (STRATEGY_INTERVAL=15m), so a single failed cancel is a plausible
      # transient venue blip (a 5xx, a rate limit) that the very next bar's retry already clears —
      # exactly the "best-effort, retried next bar" failure direction the call site itself documents.
      # Two or more inside one 30-minute window means the SAME stranded order failed to cancel on
      # back-to-back bars, which is the actual incident shape (a stop that never clears keeps
      # matching and keeps throwing).
      #
      # Severity WARNING, deliberately, not critical: `orphan_cancel_failed` was zero-seeded minutes
      # before this rule was written (Pass 2026-07-31) and this stack has no measured baseline for it
      # at all — zero historical firings to confirm the threshold doesn't trip on ordinary venue
      # flake. loop-sweep-core.mjs's prometheus_alert_firing gate promotes only `critical` to a
      # blocking alarm that halts all improvement work until it clears; handing an unbaselined,
      # hours-old counter that power on day one risks wedging every future pass on a threshold no
      # one has validated. Promote to critical once this rule has accumulated a real observation
      # window (recommend >=7 days) with zero false positives against a confirmed-healthy
      # reconciler — i.e. evidence the >1/30m threshold fires only on genuine stuck-order incidents,
      # not on isolated venue hiccups.
      - alert: AgenticOrphanStopCancelFailing
        expr: increase(agentic_venue_stop_total{event="orphan_cancel_failed"}[30m]) > 1
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Orphan algo-stop cancel failed repeatedly ({{ $value }} in 30m, venue {{ $labels.venue }}) — reconcileOrphanedAlgoStop cannot clear a stranded stop'
          runbook: 'docs/runbook.md'

  - name: crypto-bot-execution
    rules:
      # 2026-07-31 incident: the app submitted 12 reduce-only KAITO/USDT:USDT exit orders to
      # binanceusdm between 13:00:38Z and 13:05:40Z and the venue terminal-rejected every one with
      # BadRequest -4024 (PERCENT_PRICE band) — the position sat with no venue stop for 45 minutes,
      # and nothing on any continuously-running surface showed it: protective_exits_total counts
      # FIRES, not FILLS (it read a healthy 12), no rule in this file referenced
      # orders_rejected_total, and the loop's own sweep only runs ~3x/day. This rule closes that
      # gap — continuous coverage of terminal venue rejects between passes. stage="exchange" means
      # the VENUE rejected the order (as opposed to the app's own execution gate); grouped by code
      # so a burst pages with its reason attached.
      #
      # Threshold >=3 in 15m, checked against both known reject axes on this stack:
      #   - the 2026-07-31 incident was 12 rejects in ~5 minutes — fires comfortably.
      #   - the known binance spot InsufficientFunds bleed runs a measured 2/hour (order_events,
      #     event_type='REJECT', 2026-07-27..07-31) — 0.5 per 15m, so it deliberately does NOT fire
      #     here; that slow bleed is the sweep's per-venue reject-RATE alarm's job, not a burst
      #     detector's.
      #
      # Severity WARNING, and that is load-bearing: loop-sweep-core.mjs's prometheus_alert_firing
      # gate promotes only `critical` to a blocking alarm that halts all improvement work, and this
      # stack already carries a blocking per-venue reject-RATE alarm (added 2026-07-31) as the place
      # for that judgement. A critical here would wedge the loop on a condition that resolves on its
      # own (retry, reconciliation, or the kill switch) — this rule's job is annotation, not gating.
      - alert: VenueTerminalRejectBurst
        expr: sum by (code) (increase(orders_rejected_total{stage="exchange"}[15m])) >= 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Venue terminal-rejected {{ $value }} orders with code {{ $labels.code }} in the last 15m — a reject burst is not landing venue-side'
          runbook: 'docs/runbook.md'
