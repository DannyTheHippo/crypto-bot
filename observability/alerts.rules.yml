# Prometheus alerting rules (Phase 10). Every rule below references a metric the app ACTUALLY emits
# (/metrics via @willsoto/nestjs-prometheus): event_loop_delay_p99_seconds, event_loop_utilization,
# mode_info{requested,effective}, boot_info{boot_id}, kill_switch_state{state} (MetricsService, 5s),
# reconciliation_mismatch_total + reconciliation_runs_total{result} (ReconciliationService), and
# agent_decide_total{outcome} (AgentMetricsRecorder). All rules are ACTIVE — none stubbed.
# Trading gauges (equity_usdt, day_pnl_usdt, drawdown_ratio, realized_pnl_usdt, position_*, fills_total,
# orders_total{outcome}, orders_rejected_total{code}) are also emitted and surfaced on the Grafana
# dashboards; add threshold alerts here (e.g. daily-loss / drawdown approaching limits) as desired.
groups:
  - name: crypto-bot-health
    rules:
      - alert: TargetDown
        expr: up{job="crypto-bot"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: 'crypto-bot /metrics target is down'
          runbook: 'docs/runbook.md#halt-response'

      - alert: EventLoopBudgetBreach
        # §8 event-loop budget: p99 loop delay over 50ms sustained means the single-threaded hot
        # path (strategy → risk → execution) is being starved — order latency and the OMS query
        # loops degrade. Budget is conservative for a trading loop.
        expr: event_loop_delay_p99_seconds > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: 'Event-loop p99 delay over the 50ms budget ({{ $value }}s)'
          runbook: 'docs/runbook.md'

      - alert: EventLoopUtilizationHigh
        expr: event_loop_utilization > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Event-loop utilization sustained above 90% ({{ $value }})'

      # v3 §8 memory guardrail: the single unified process (both venues, one composition graph)
      # replaces the v2 spot/perp process pair — process_resident_memory_bytes is prom-client's
      # default metric (always emitted, no app-side wiring needed). 1.2 GiB is the compose mem_limit
      # (1536m) minus headroom before an OOM kill; threshold tightens to measured peaks at the
      # validation gate per the spec's own footprint-acceptance note.
      - alert: AppMemoryHigh
        expr: process_resident_memory_bytes > 1.2e9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'crypto-bot RSS sustained above 1.2 GiB for 10m ({{ $value | humanize1024 }}B) — approaching the 1536m compose mem_limit'
          runbook: 'docs/runbook.md'

  - name: crypto-bot-mode
    rules:
      # Paper-honesty visibility: surfaces whenever the process is resolving to a non-paper effective
      # mode. Not an error (live is legitimate when armed) — an info-level notice so operators always
      # know the live wall state. Pages should come from the kill-switch alerts (below) once emitted.
      - alert: EffectiveModeLive
        expr: mode_info{effective="live"} == 1
        for: 0m
        labels: { severity: info }
        annotations:
          summary: 'Effective trading mode is LIVE (boot_id label on boot_info)'
          runbook: 'docs/runbook.md#re-arm-live-arming-interlock-10b--out-of-session'

  - name: crypto-bot-safety
    rules:
      # kill_switch_state is emitted by MetricsService (sampled every 5s; only the active state = 1).
      - alert: KillSwitchEngaged
        expr: kill_switch_state{state!="RUNNING"} == 1
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Kill switch is engaged (not RUNNING) — trading halted'
          runbook: 'docs/runbook.md#halt-response'

      - alert: HaltedDegraded
        expr: kill_switch_state{state="HALTED_DEGRADED"} == 1
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Kill switch HALTED_DEGRADED — cancels unconfirmed, venue orders may be live'
          runbook: 'docs/runbook.md#halt-response'

      # Halting mismatch classes (UNKNOWN_OURS_OPEN, FILL_FOR_UNKNOWN_ORDER, balance drift) engage
      # the kill switch and label the pass result="halt" — this pages the reconciliation cause by
      # name (KillSwitchEngaged fires alongside, but its state label doesn't say WHY).
      - alert: ReconciliationHalt
        expr: increase(reconciliation_runs_total{result="halt"}[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Reconciliation hit a halting mismatch class — kill switch engaged, never auto-flattened'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # reconciliation_mismatch_total is split by mismatch class since backlog #24. The benign
      # classes are excluded here: foreign_open_order (the shared demo wallet's manual-trading
      # steady state — the reason this alert used to fire 24/7), adopted_terminal and
      # backfilled_fill (stream misses healed from venue truth — self-correcting by definition).
      # Everything else (sweep/query failures, non-adoptable statuses, and the halting classes) is
      # actionable signal; halting classes ALSO page critical via ReconciliationHalt +
      # KillSwitchEngaged above.
      - alert: ReconciliationMismatch
        expr: increase(reconciliation_mismatch_total{class!~"foreign_open_order|adopted_terminal|backfilled_fill"}[5m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Actionable reconciliation mismatches in the last 5m (benign classes excluded — see class label)'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # A stalled reconciler is itself a fault (§8): a pass that throws leaves venue truth
      # unconfirmed while trading continues — the 2026-07-07 CANCEL_PENDING/VENUE_CANCELED
      # TransitionError killed every pass for an hour with only warn lines to show for it.
      # "Stalled" = no pass COMPLETING, deliberately not "no clean pass": on the shared demo
      # wallet, foreign resting orders make a small per-pass mismatch count the healthy steady
      # state (WARN-and-ignore class), so a clean-pass age would fire forever on a working
      # reconciler. Any result but error means venue truth was read end-to-end. 10 minutes =
      # 20 missed 30s passes, far beyond transient venue flake.
      - alert: ReconcilerStalled
        expr: sum(increase(reconciliation_runs_total{result!="error"}[10m])) == 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'No reconciliation pass has completed in over 10 minutes — venue truth unconfirmed'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

      # Catches intermittent pass errors that never trip the 10-minute stall (some passes clean,
      # some throwing) — e.g. one symbol's sweep failing while the rest reconcile.
      - alert: ReconcilePassErrors
        expr: increase(reconciliation_runs_total{result="error"}[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Reconciliation passes are erroring (result="error" in the last 15m)'
          runbook: 'docs/runbook.md#reconciliation-mismatch-64'

  - name: crypto-bot-market-data
    rules:
      # 2026-07-16 incident (Pass 30): all five spot candle channels hung silently for 8h — ccxt's
      # watch* future stays pending forever when the venue drops a subscription server-side, the
      # supervised loops only act when the promise settles, and nothing exported channel age. The
      # in-process watchdog now force-reconnects at 180s of core-channel silence; this alert is the
      # independent backstop for the watchdog itself failing to recover the stream (10m of staleness
      # = at least 3 forced-reconnect attempts that did not help). Core channels only: trade/book
      # power info blocks and paper fills, and legitimately idle longer on quiet markets.
      - alert: MarketChannelStale
        expr: max by (symbol, channel) (market_channel_staleness_seconds{channel=~"ticker|candle:.*"}) > 600
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'Market-data channel {{ $labels.channel }} for {{ $labels.symbol }} silent >10m despite the stream watchdog — strategies are trading blind'
          runbook: 'docs/runbook.md'

      # The watchdog firing occasionally is the fix working; a sustained reconnect cadence means
      # the venue connection is flapping (or the stall diagnosis is wrong) and deserves a look
      # before it degrades decide cadence.
      - alert: MarketStreamReconnectStorm
        expr: increase(market_stream_forced_reconnects_total[1h]) >= 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Stream watchdog forced {{ $value }} reconnects in the last hour — market-data connection is flapping'
          runbook: 'docs/runbook.md'

  - name: crypto-bot-agentic
    rules:
      # The Anthropic client latches itself degraded on the first FATAL API error (bad key, rejected
      # schema — anthropic-agent-client.ts): every later propose() short-circuits to an empty
      # proposal, which the metrics wrapper records as 'hold', so the lane looks alive while making
      # zero LLM calls (2026-07-07: a 400 on the first plan-mode decide cost ~1h of dead air with a
      # single warn line). agent_decide_total resets on the container recreate that also clears the
      # latch, so this fires for exactly the latch's lifetime.
      - alert: AgentClientFatalLatch
        expr: sum(agent_decide_total{outcome="error_fatal"}) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: 'Agent client hit a FATAL API error — lane latched degraded (zero LLM calls) until the app container is recreated'
          runbook: 'docs/runbook.md'

      # W2 (2026-07-08): the reflection learning loop was silently dead for 4 days because every
      # minted candidate tripped the polarity-blind banned-word validator (confirmed live:
      # playbook_validator_rejections_total{banned_token="true"}=1, playbook stuck at the v1 seed).
      # The reflection prompt was reworded to avoid the trigger words; this alert warns if a future
      # model still emits a banned token so the loop can never iterate — instead of it dying
      # invisibly again. Warning, not critical: one rejection is recoverable (the seed stays
      # active); a sustained pattern is the real failure. Requires agentic_reflection_outcomes_total
      # (added W2, AgentMetricsRecorder). Threshold dropped to >=1 (from >=2): reflection.service.ts
      # now retries a rejected draft once with feedback before recording validator_reject (backlog
      # #31), so a recorded validator_reject is already a two-strike event — the old >=2-in-6h bar
      # would have required FOUR consecutive draft rejections to fire.
      - alert: AgenticReflectionRejects
        expr: sum(increase(agentic_reflection_outcomes_total{outcome="validator_reject"}[6h])) >= 1
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'A reflection candidate was rejected by the playbook validator after its feedback retry (validator_reject in 6h) — the learning loop cannot iterate'
          runbook: 'docs/runbook.md'

      # Backlog #31: a level-based (max_over_time, not increase/rate) companion to
      # AgenticReflectionRejects — increase() and rate() both miss a counter's first sample after a
      # container recreate resets it (a fresh series has nothing to increase FROM), so a lane that
      # reflects exactly once right after a redeploy and gets rejected would never trip a
      # increase()-based alert. sum(max_over_time(...[24h])) instead reads the highest value the
      # counter held at any scrape in the window, which survives a mid-window reset because the
      # pre-reset high-water mark is still in the range. `unless` fires only when rejects are present
      # AND minted is absent in the same 24h window — a lane that eventually mints (even after
      # earlier rejects) does not trip this.
      - alert: AgenticReflectionNeverMinted
        expr: |
          sum(max_over_time(agentic_reflection_outcomes_total{outcome="validator_reject"}[24h])) > 0
          unless
          sum(max_over_time(agentic_reflection_outcomes_total{outcome="minted"}[24h])) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Reflection has rejected candidates in the last 24h but minted none — the learning loop is rejecting and never advancing the playbook'
          runbook: 'docs/runbook.md'
