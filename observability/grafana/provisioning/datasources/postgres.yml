apiVersion: 1

datasources:
  # W1 (Grafana rebuild): read-only truth source for panels Prometheus cannot answer (positions
  # table, agent_decisions incl. plan_json/thesis, closed round trips, promotion progress) — see
  # observability/grafana/grafana_ro.sql for the grafana_ro role this connects as (SELECT only).
  # Password interpolation uses `$__env{}`, NOT `${VAR}` — Grafana's provisioning docs show ${VAR}
  # truncates at the first non-word character (their own example: `${PASSWORD}` resolves to just
  # "Pa" of "Pa$sw0rd"); `$__env{}` is the documented-correct form for postgres/mysql datasources.
  # Pinned uid (not auto-generated): the dashboard JSON references this datasource by {type, uid}
  # object, and a pinned value survives the eventual GCP lift unchanged (a fresh Grafana volume
  # provisioned from this same file mints the identical uid, so the dashboard JSON needs no edits
  # post-migration). v3: the second (perp) RO datasource this file used to carry is deleted — one
  # process, one DB, one datasource (spec §9).
  - name: Postgres (RO)
    uid: postgres-ro-spot
    type: postgres
    access: proxy
    url: postgres:5432
    database: cryptobot
    user: grafana_ro
    secureJsonData:
      password: $__env{GRAFANA_RO_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: false
    editable: false
