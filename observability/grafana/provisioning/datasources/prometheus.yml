apiVersion: 1

datasources:
  # Pinned uid (not auto-generated): dashboard JSON references this datasource by {type, uid}
  # object. A pinned uid survives the eventual GCP lift unchanged: a fresh Grafana volume
  # provisioned from this same file mints the identical uid, so the dashboard JSON needs no edits
  # post-migration. v3: the second (perp) Prometheus datasource this file used to carry is deleted —
  # one process, one Prometheus, one datasource (spec §9).
  - name: Prometheus
    uid: prometheus-spot
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
